<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDO Web (Beta)</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080b14;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(circle at 20% 10%,rgba(55,85,255,.18),transparent 28%),
        radial-gradient(circle at 85% 15%,rgba(135,55,255,.16),transparent 30%),
        linear-gradient(rgba(70,90,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(70,90,255,.035) 1px,transparent 1px);
    background-size:auto,auto,45px 45px,45px 45px;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 35%,rgba(50,80,255,.07),transparent 35%);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    padding:14px 18px;
    background:rgba(8,10,18,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(120,130,255,.12);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:26px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#6c8cff,#a05cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.beta{
    display:inline-block;
    vertical-align:middle;
    margin-left:5px;
    padding:5px 8px;
    border-radius:8px;
    font-size:10px;
    letter-spacing:1px;
    background:rgba(100,80,255,.13);
    color:#a58cff;
    -webkit-text-fill-color:#a58cff;
}

.menu-btn{
    width:45px;
    height:45px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    color:white;
    font-size:25px;
    cursor:pointer;
}

.menu-btn:active{
    transform:scale(.94);
}

/* SIDE MENU */

.overlay{
    position:fixed;
    inset:0;
    z-index:1500;
    background:rgba(0,0,0,.55);
    display:none;
}

.overlay.active{
    display:block;
}

.side-menu{
    position:fixed;
    right:-310px;
    top:0;
    z-index:2000;
    width:290px;
    height:100vh;
    padding:25px 18px;
    background:rgba(9,12,23,.98);
    backdrop-filter:blur(20px);
    border-left:1px solid rgba(110,120,255,.15);
    transition:.35s ease;
    box-shadow:-20px 0 50px rgba(0,0,0,.4);
}

.side-menu.active{
    right:0;
}

.side-title{
    margin:8px 0 25px;
    font-size:22px;
    font-weight:bold;
    color:#8797ff;
}

.close-menu{
    position:absolute;
    right:18px;
    top:15px;
    border:0;
    background:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.side-item{
    display:block;
    width:100%;
    margin-bottom:9px;
    padding:14px;
    border:1px solid rgba(120,130,255,.08);
    border-radius:12px;
    background:rgba(255,255,255,.045);
    color:#c5c9d6;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.side-item:hover{
    background:rgba(90,100,255,.16);
    color:white;
}

/* MAIN */

main{
    max-width:1200px;
    margin:auto;
    padding:22px 16px 60px;
}

/* HERO */

.hero{
    position:relative;
    overflow:hidden;
    min-height:215px;
    padding:32px 25px;
    margin-bottom:25px;
    border-radius:25px;
    border:1px solid rgba(105,120,255,.16);
    background:
        radial-gradient(circle at 85% 25%,rgba(100,60,255,.3),transparent 30%),
        radial-gradient(circle at 55% 100%,rgba(40,80,255,.14),transparent 40%),
        linear-gradient(135deg,#111a38,#121326);
    box-shadow:0 15px 55px rgba(0,0,0,.25);
}

.hero::before{
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    right:-100px;
    top:-100px;
    border:1px solid rgba(120,130,255,.16);
    border-radius:50%;
    box-shadow:
        0 0 0 25px rgba(100,100,255,.035),
        0 0 0 55px rgba(100,100,255,.025);
}

.hero h1{
    position:relative;
    z-index:2;
    font-size:34px;
    margin-bottom:10px;
}

.hero h1 span{
    color:#7893ff;
}

.hero p{
    position:relative;
    z-index:2;
    max-width:700px;
    color:#9da5bb;
    line-height:1.65;
    font-size:16px;
}

.status{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:17px;
    padding:8px 12px;
    border-radius:20px;
    background:rgba(50,220,125,.07);
    border:1px solid rgba(50,220,125,.13);
    color:#6de4a0;
    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#45e48a;
    box-shadow:0 0 12px #45e48a;
}

/* SEARCH */

.search-box{
    position:relative;
    margin-bottom:18px;
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:#7d87a0;
    font-size:19px;
    pointer-events:none;
}

.search-box input{
    width:100%;
    padding:16px 18px 16px 48px;
    border:1px solid rgba(120,130,255,.12);
    border-radius:16px;
    outline:none;
    background:rgba(255,255,255,.045);
    color:white;
    font-size:15px;
    transition:.25s;
}

.search-box input:focus{
    border-color:#667aff;
    box-shadow:0 0 25px rgba(90,100,255,.12);
}

.search-box input::placeholder{
    color:#737b91;
}

/* CATEGORY */

.category-scroll{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:8px;
    margin-bottom:25px;
    scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex-shrink:0;
    padding:11px 16px;
    border:1px solid rgba(120,130,255,.11);
    border-radius:14px;
    background:rgba(255,255,255,.045);
    color:#aeb4c7;
    cursor:pointer;
    transition:.2s;
    font-size:14px;
}

.category-btn.active{
    background:linear-gradient(135deg,#536dff,#814cff);
    color:white;
    border-color:transparent;
    box-shadow:0 8px 25px rgba(80,80,255,.2);
}

.category-btn:hover{
    color:white;
}

/* SECTION */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.section-head h2{
    font-size:21px;
}

.file-count{
    color:#687189;
    font-size:12px;
}

/* FILE GRID */

.file-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    position:relative;
    overflow:hidden;
    padding:15px;
    border-radius:18px;
    border:1px solid rgba(120,130,255,.1);
    background:rgba(255,255,255,.035);
    transition:.25s;
}

.card::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    right:-50px;
    top:-50px;
    background:rgba(90,100,255,.07);
    border-radius:50%;
    filter:blur(10px);
}

.card:hover{
    transform:translateY(-4px);
    border-color:rgba(110,120,255,.3);
    background:rgba(255,255,255,.055);
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.card-top{
    position:relative;
    z-index:2;
    display:flex;
    gap:12px;
    align-items:center;
}

.file-icon{
    width:55px;
    height:55px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:14px;
    border:1px solid rgba(120,130,255,.14);
    background:linear-gradient(135deg,#202a56,#17182d);
    font-size:25px;
}

.file-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.file-info{
    min-width:0;
}

.file-name{
    font-size:15px;
    font-weight:bold;
    line-height:1.35;
    word-break:break-word;
}

.file-type{
    display:inline-block;
    margin-top:5px;
    padding:4px 7px;
    border-radius:6px;
    background:rgba(100,110,255,.1);
    color:#9daaff;
    font-size:9px;
    font-weight:bold;
}

.card-category{
    position:relative;
    z-index:2;
    margin-top:13px;
    color:#727b91;
    font-size:11px;
}

.download-btn{
    position:relative;
    z-index:2;
    display:block;
    width:100%;
    margin-top:13px;
    padding:11px;
    border-radius:11px;
    background:linear-gradient(135deg,#4f69ff,#7948ed);
    color:white;
    text-align:center;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    transition:.2s;
}

.download-btn:hover{
    filter:brightness(1.12);
    box-shadow:0 8px 22px rgba(80,70,255,.2);
}

.download-btn:active{
    transform:scale(.97);
}

/* EMPTY */

.empty{
    padding:50px 20px;
    border:1px dashed rgba(120,130,255,.15);
    border-radius:18px;
    text-align:center;
    color:#737c91;
}

/* REPORT */

.report{
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,100,100,.12);
    background:linear-gradient(135deg,rgba(255,90,90,.08),rgba(255,160,70,.03));
}

.report h2{
    margin-bottom:10px;
}

.report p{
    color:#999fb0;
    line-height:1.6;
}

.report-btn{
    display:inline-block;
    margin-top:17px;
    padding:12px 18px;
    border-radius:11px;
    background:#20b95c;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */

footer{
    padding:30px 15px 40px;
    text-align:center;
    color:#5f677b;
    font-size:12px;
}

footer strong{
    color:#8b97ff;
}

/* MOBILE */

@media(max-width:850px){

    .file-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:560px){

    header{
        padding:13px 14px;
    }

    .logo{
        font-size:22px;
    }

    main{
        padding:18px 10px 45px;
    }

    .hero{
        min-height:215px;
        padding:27px 20px;
        border-radius:22px;
    }

    .hero h1{
        font-size:28px;
    }

    .hero p{
        font-size:15px;
    }

    .file-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:14px;
    }

}
</style>
</head>

/* =====================================================
   HELPERS
===================================================== */

function emoji(category){

    if(category==="addon") return "🧩";
    if(category==="map") return "🗺️";
    if(category==="texture") return "🎨";
    if(category==="apk") return "📱";
    if(category==="script") return "📜";

    return "📦";
}

function categoryName(category){

    if(category==="addon") return "Add-on";
    if(category==="map") return "Map";
    if(category==="texture") return "Texture Pack";
    if(category==="apk") return "APK & Client";
    if(category==="script") return "Script";

    return "File";
}

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   MENU
===================================================== */

function openMenu(){

    document.getElementById("sideMenu").classList.add("active");
    document.getElementById("overlay").classList.add("active");

}

function closeMenu(){

    document.getElementById("sideMenu").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");

}


/* =====================================================
   RENDER
===================================================== */

function renderFiles(list,title){

    const content=document.getElementById("content");

    if(!content) return;

    if(!list || list.length===0){

        content.innerHTML=`
            <div class="empty">
                <div style="font-size:42px;margin-bottom:10px;">🔍</div>
                <h3>File tidak ditemukan</h3>
                <p style="margin-top:8px;">
                    Coba cari dengan kata lain.
                </p>
            </div>
        `;

        return;
    }

    let html=`

        <div class="section-head">

            <h2>${title}</h2>

            <span class="file-count">
                ${list.length} file
            </span>

        </div>

        <div class="file-grid">
    `;

    list.forEach((file,index)=>{

        let icon;

        if(file.icon){

            icon=`
                <img
                    src="${file.icon}"
                    alt=""
                    onerror="this.style.display='none';this.parentElement.insertAdjacentText('beforeend','${emoji(file.category)}')"
                >
            `;

        }else{

            icon=emoji(file.category);

        }

        html+=`

            <div class="card">

                <div class="card-top">

                    <div class="file-icon">
                        ${icon}
                    </div>

                    <div class="file-info">

                        <div class="file-name">
                            ${escapeHTML(file.name)}
                        </div>

                        <span class="file-type">
                            ${escapeHTML(file.type)}
                        </span>

                    </div>

                </div>

                <div class="card-category">
                    ${categoryName(file.category)}
                </div>

                <a
                    class="download-btn"
                    href="${file.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ⬇️ Download
                </a>

            </div>

        `;

    });

    html+=`</div>`;

    content.innerHTML=html;
}


/* =====================================================
   CATEGORY
===================================================== */

function activateCategory(category){

    document.querySelectorAll(".category-btn").forEach(btn=>{
        btn.classList.remove("active");
    });

    const button=document.getElementById("cat-"+category);

    if(button){
        button.classList.add("active");
    }
}

function showCategory(category){

    const search=document.getElementById("searchInput");

    if(search){
        search.value="";
    }

    activateCategory(category);

    if(category==="home"){

        /* LANGSUNG TAMPILKAN SEMUA FILE */
        renderFiles(
            files,
            "🔥 Semua File"
        );

        return;
    }

    const result=files.filter(file=>{
        return file.category===category;
    });

    renderFiles(
        result,
        categoryName(category)
    );
}


/* =====================================================
   SEARCH
===================================================== */

function searchFiles(){

    const input=document.getElementById("searchInput");

    if(!input) return;

    const query=input.value
        .toLowerCase()
        .trim();

    if(query===""){

        showCategory("home");

        return;
    }

    document.querySelectorAll(".category-btn").forEach(btn=>{
        btn.classList.remove("active");
    });

    const result=files.filter(file=>{

        return (
            file.name.toLowerCase().includes(query) ||
            file.type.toLowerCase().includes(query) ||
            categoryName(file.category).toLowerCase().includes(query)
        );

    });

    renderFiles(
        result,
        "🔎 Hasil Pencarian"
    );
}
