<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080f">

<title>EDO Web (Beta)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#07080f;
    --text:#eef0ff;
    --muted:#8f94b8;
    --glass:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --violet:#7c5cff;
    --cyan:#22d3ee;
    --grad:linear-gradient(135deg,#7c5cff,#22d3ee);
    --ease:cubic-bezier(.2,.7,.2,1);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

[hidden]{ display:none !important; }

html{ -webkit-text-size-adjust:100%; }

body{
    font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.4;
}

body.locked{
    overflow:hidden;
    height:100vh;
}

button,input,textarea{ font-family:inherit; }

:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
}

/* =========================
   LATAR AURORA
========================= */

.aurora{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}

.aurora i{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle,var(--c) 0%,transparent 62%);
    animation:drift 24s ease-in-out infinite alternate;
}

.aurora i:nth-child(1){
    --c:rgba(124,92,255,.5);
    width:80vmax; height:80vmax;
    top:-42vmax; left:-30vmax;
}

.aurora i:nth-child(2){
    --c:rgba(34,211,238,.3);
    width:75vmax; height:75vmax;
    bottom:-45vmax; right:-35vmax;
    animation-duration:30s;
    animation-delay:-9s;
}

.aurora i:nth-child(3){
    --c:rgba(251,113,133,.18);
    width:50vmax; height:50vmax;
    top:35%; left:45%;
    animation-duration:36s;
    animation-delay:-16s;
}

.aurora::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 72%);
            mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 72%);
}

@keyframes drift{
    to{ transform:translate(12vmax,8vmax) scale(1.15); }
}

@keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-12px); }
}

@keyframes floatHero{
    0%,100%{ transform:translateY(-50%) rotate(-8deg); }
    50%{ transform:translateY(calc(-50% - 14px)) rotate(-3deg); }
}

@keyframes rise{
    from{ opacity:0; transform:translateY(22px); }
    to{ opacity:1; transform:none; }
}

/* =========================
   INTRO
========================= */

#welcome{
    position:fixed;
    inset:0;
    z-index:100;
    display:grid;
    place-items:center;
    text-align:center;
    padding:24px;
    background:
        radial-gradient(120% 90% at 50% 0%,#1d1650 0%,#0b0b1d 48%,#06070d 100%);
    clip-path:circle(150% at var(--x,50%) var(--y,60%));
    transition:clip-path .95s cubic-bezier(.75,0,.2,1);
}

#welcome.wipe{
    clip-path:circle(0% at var(--x) var(--y));
}

#welcome::before{
    content:"";
    position:absolute;
    width:min(120vw,720px);
    height:min(120vw,720px);
    border-radius:50%;
    background:radial-gradient(circle,rgba(124,92,255,.35),transparent 65%);
    animation:pulse 5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{ transform:scale(.9); opacity:.7; }
    50%{ transform:scale(1.08); opacity:1; }
}

.w-inner{
    position:relative;
    width:100%;
    max-width:440px;
}

.w-cube{
    width:116px;
    height:116px;
    margin:0 auto 22px;
    filter:drop-shadow(0 18px 38px rgba(124,92,255,.6));
    animation:cubeIn 1s var(--ease) both, float 4.2s ease-in-out 1s infinite;
}

.w-cube svg{ width:100%; height:100%; display:block; }

@keyframes cubeIn{
    from{ opacity:0; transform:translateY(30px) scale(.6) rotate(-25deg); }
    to{ opacity:1; transform:none; }
}

#welcome.go .w-cube{
    animation:cubeGo .75s cubic-bezier(.6,0,.3,1) forwards;
}

@keyframes cubeGo{
    0%{ transform:rotate(0) scale(1); }
    60%{ transform:rotate(300deg) scale(1.22); }
    100%{ transform:rotate(360deg) scale(1.05); }
}

.w-title{
    display:flex;
    justify-content:center;
    font-size:clamp(42px,13vw,66px);
    font-weight:800;
    letter-spacing:-.035em;
    line-height:1;
}

.w-title .ch{
    display:inline-block;
    opacity:0;
    transform:translateY(45%) rotate(5deg);
    animation:chIn .75s var(--ease) forwards;
    animation-delay:calc(.35s + var(--i) * .06s);
}

@keyframes chIn{
    to{ opacity:1; transform:none; }
}

.w-badge{
    display:inline-block;
    margin-top:14px;
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    color:#c4b5fd;
    background:rgba(124,92,255,.16);
    border:1px solid rgba(124,92,255,.4);
    opacity:0;
    animation:rise .7s var(--ease) .85s forwards;
}

.w-sub{
    max-width:340px;
    margin:16px auto 32px;
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    opacity:0;
    animation:rise .7s var(--ease) 1s forwards;
}

.enter-btn{
    position:relative;
    overflow:hidden;
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:0;
    padding:16px 34px;
    border-radius:999px;
    background:var(--grad);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 14px 40px -10px rgba(124,92,255,.8);
    opacity:0;
    animation:rise .7s var(--ease) 1.15s forwards;
    transition:transform .25s var(--ease), filter .25s;
}

.enter-btn svg{
    width:20px; height:20px;
    transition:transform .25s var(--ease);
}

.enter-btn:hover{ transform:translateY(-3px); filter:brightness(1.08); }
.enter-btn:hover svg{ transform:translateX(4px); }
.enter-btn:active{ transform:scale(.97); }

.enter-btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);
    transform:translateX(-130%);
    animation:shimmer 3s ease-in-out 2.2s infinite;
}

@keyframes shimmer{
    0%{ transform:translateX(-130%); }
    45%,100%{ transform:translateX(130%); }
}

#welcome.go .w-title,
#welcome.go .w-badge,
#welcome.go .w-sub,
#welcome.go .enter-btn{
    opacity:0 !important;
    transform:translateY(14px);
    transition:opacity .35s ease, transform .35s ease;
    animation:none;
}

/* =========================
   WEBSITE
========================= */

#website{
    position:relative;
    z-index:1;
}

.reveal{ opacity:0; }

.site-in .reveal{
    animation:rise .85s var(--ease) both;
    animation-delay:var(--d,0s);
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1040px;
    margin:0 auto;
    padding:20px 18px 6px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
    font-weight:800;
    letter-spacing:-.02em;
}

.brand svg{ width:32px; height:32px; display:block; }

.beta{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    color:#c4b5fd;
    background:rgba(124,92,255,.16);
    border:1px solid rgba(124,92,255,.38);
}

.wrap{
    max-width:1040px;
    margin:0 auto;
    padding:0 18px 56px;
}

/* search */

.search{
    position:relative;
    margin:12px 0 4px;
}

.search svg{
    position:absolute;
    left:16px;
    top:50%;
    width:20px; height:20px;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
}

.search input{
    width:100%;
    padding:16px 16px 16px 48px;
    border-radius:18px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.06);
    color:var(--text);
    font-size:15px;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
}

.search input::placeholder{ color:#70759a; }

.search input:focus{
    border-color:rgba(124,92,255,.7);
    background:rgba(255,255,255,.08);
    box-shadow:0 0 0 4px rgba(124,92,255,.18);
}

/* tabs */

#tabs{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    gap:8px;
    margin:0 -18px;
    padding:10px 18px 12px;
    overflow-x:auto;
    scrollbar-width:none;
    background:linear-gradient(rgba(7,8,15,.88),rgba(7,8,15,.55));
    -webkit-backdrop-filter:blur(14px);
            backdrop-filter:blur(14px);
}

#tabs::-webkit-scrollbar{ display:none; }

#tabs button{
    flex-shrink:0;
    padding:10px 17px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--glass);
    color:var(--muted);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .25s, color .25s, border-color .25s, box-shadow .25s, transform .15s;
}

#tabs button:hover{ color:var(--text); border-color:rgba(255,255,255,.2); }
#tabs button:active{ transform:scale(.96); }

#tabs button.active{
    background:var(--grad);
    border-color:transparent;
    color:#fff;
    box-shadow:0 8px 24px -8px rgba(124,92,255,.8);
}

/* hero */

.hero{
    position:relative;
    overflow:hidden;
    margin:10px 0 22px;
    padding:32px 24px 28px;
    border-radius:28px;
    border:1px solid var(--line);
    background:
        linear-gradient(135deg,rgba(124,92,255,.3),rgba(34,211,238,.1) 58%,rgba(255,255,255,.03));
}

.hero > *:not(.hero-cube){
    position:relative;
    z-index:2;
}

.hero h2{
    max-width:15em;
    font-size:clamp(27px,6.4vw,42px);
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1.12;
}

.hero p{
    max-width:30em;
    margin:14px 0 22px;
    color:#b4b8d6;
    font-size:15px;
    line-height:1.65;
}

.hero-cta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.btn-primary,
.btn-ghost{
    border:0;
    padding:13px 20px;
    border-radius:14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:transform .2s var(--ease), filter .2s, background .2s;
}

.btn-primary{
    background:var(--grad);
    color:#fff;
    box-shadow:0 10px 28px -10px rgba(124,92,255,.85);
}

.btn-ghost{
    background:rgba(255,255,255,.08);
    color:var(--text);
    border:1px solid var(--line);
}

.btn-primary:hover,
.btn-ghost:hover{ transform:translateY(-2px); filter:brightness(1.1); }
.btn-primary:active,
.btn-ghost:active{ transform:scale(.97); }

.stats{
    display:flex;
    gap:28px;
    margin-top:26px;
}

.stat b{
    display:block;
    font-size:24px;
    font-weight:800;
    letter-spacing:-.02em;
}

.stat span{
    font-size:12.5px;
    color:var(--muted);
}

.hero-cube{
    position:absolute;
    right:-14px;
    top:50%;
    z-index:1;
    width:min(44%,230px);
    aspect-ratio:1;
    opacity:.95;
    filter:drop-shadow(0 22px 40px rgba(124,92,255,.5));
    animation:floatHero 6.5s ease-in-out infinite;
}

.hero-cube svg{ width:100%; height:100%; display:block; }

@media (max-width:560px){
    .hero{ padding:26px 20px 24px; }
    .hero-cube{
        width:150px;
        right:-34px;
        top:26%;
        opacity:.3;
    }
}

/* menu */

.block-title{
    font-size:17px;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0 0 12px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
    margin-bottom:30px;
}

.tile{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
    padding:16px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--glass);
    color:var(--text);
    text-align:left;
    cursor:pointer;
    transition:transform .3s var(--ease), border-color .3s, background .3s, box-shadow .3s;
}

.site-in .tile{
    animation:rise .7s var(--ease) both;
    animation-delay:calc(.6s + var(--i) * 70ms);
}

.tile:hover{
    transform:translateY(-5px);
    border-color:var(--c);
    border-color:color-mix(in srgb,var(--c) 55%,transparent);
    background:color-mix(in srgb,var(--c) 9%,rgba(255,255,255,.04));
    box-shadow:0 18px 36px -18px var(--c);
}

.tile:active{ transform:scale(.97); }

.tile .ico{
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border-radius:14px;
    color:var(--c);
    background:rgba(255,255,255,.07);
    background:color-mix(in srgb,var(--c) 17%,transparent);
}

.tile .ico svg{ width:22px; height:22px; }

.tile b{ display:block; font-size:15px; font-weight:700; }
.tile small{ display:block; margin-top:2px; font-size:12.5px; color:var(--muted); }

/* daftar file */

.view-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin:4px 0 14px;
}

.view-head h2{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.02em;
}

.view-head .count{
    font-size:13px;
    color:var(--muted);
}

.grid{
    display:grid;
    gap:12px;
    grid-template-columns:1fr;
}

@media (min-width:720px){
    .grid{ grid-template-columns:1fr 1fr; }
}

.card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
    overflow:hidden;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--glass);
    transition:border-color .3s, transform .3s var(--ease);
}

.site-in .card{
    animation:rise .6s var(--ease) both;
    animation-delay:calc(min(var(--i),12) * 45ms);
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.1),transparent 70%);
    background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 24%,transparent),transparent 70%);
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
}

.card:hover{
    border-color:rgba(255,255,255,.2);
    border-color:color-mix(in srgb,var(--c) 45%,transparent);
}

.card:hover::before{ opacity:1; }

.card > *{ position:relative; }

.logo{
    position:relative;
    flex-shrink:0;
    width:60px;
    height:60px;
    display:grid;
    place-items:center;
    overflow:hidden;
    border-radius:17px;
    color:#fff;
    font-size:18px;
    font-weight:800;
    letter-spacing:-.02em;
    background:var(--c);
    background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 10px 22px -10px var(--c);
}

.logo img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#0d0e1a;
}

.info{
    flex:1;
    min-width:0;
}

.name{
    font-size:16px;
    font-weight:700;
    line-height:1.25;
    letter-spacing:-.01em;
    overflow-wrap:anywhere;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:9px;
}

.tag{
    padding:3px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
}

.tag.cat{
    color:var(--c);
    background:rgba(255,255,255,.08);
    background:color-mix(in srgb,var(--c) 15%,transparent);
}

.tag.type{
    color:var(--muted);
    border:1px solid var(--line);
}

.dl{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:11px 15px;
    border-radius:14px;
    background:var(--grad);
    color:#fff;
    font-size:13.5px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 10px 24px -10px rgba(124,92,255,.8);
    transition:transform .2s var(--ease), filter .2s;
}

.dl svg{ width:17px; height:17px; }
.dl:hover{ transform:translateY(-2px); filter:brightness(1.1); }
.dl:active{ transform:scale(.96); }

@media (max-width:380px){
    .dl span{ display:none; }
    .dl{ padding:12px; }
}

.empty{
    grid-column:1/-1;
    padding:48px 12px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

/* laporan */

.panel{
    padding:22px;
    border-radius:24px;
    border:1px solid var(--line);
    background:var(--glass);
    max-width:620px;
}

.panel label{
    display:block;
    margin:0 0 7px;
    font-size:13px;
    font-weight:600;
    color:#b4b8d6;
}

.panel input,
.panel textarea{
    width:100%;
    margin-bottom:16px;
    padding:14px 15px;
    border-radius:14px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.05);
    color:var(--text);
    font-size:15px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
}

.panel textarea{
    min-height:130px;
    resize:vertical;
}

.panel input:focus,
.panel textarea:focus{
    border-color:rgba(124,92,255,.7);
    box-shadow:0 0 0 4px rgba(124,92,255,.18);
}

/* footer */

footer{
    position:relative;
    z-index:1;
    padding:26px 18px 34px;
    text-align:center;
    color:#5f6488;
    font-size:13px;
    border-top:1px solid var(--line);
}

@media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
        animation:none !important;
        transition:none !important;
    }
    .reveal,
    .w-title .ch,
    .w-badge,
    .w-sub,
    .enter-btn{
        opacity:1 !important;
        transform:none !important;
    }
}
</style>
</head>

<div class="aurora"><i></i><i></i><i></i></div>


<!-- =====================================================
     INTRO
===================================================== -->

<div id="welcome">

    <div class="w-inner">

        <div class="w-cube">
            <svg viewBox="0 0 120 120"><use href="#cube" width="120" height="120"/></svg>
        </div>

        <h1 class="w-title" id="wTitle" aria-label="EDO Web"></h1>

        <span class="w-badge">Beta</span>

        <p class="w-sub">
            Add-on, map, texture pack, APK, dan script Minecraft Bedrock dalam satu tempat.
        </p>

    { key:"map",     label:"Map" },

let current = "home";
let query = "";

const $ = id => document.getElementById(id);


/* =====================================================
   HELPER
===================================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


function initials(name){

    return (name.match(/[A-Za-z0-9]+/g) || ["?"])
        .slice(0,2)
        .map(w => w[0].toUpperCase())
        .join("");

}


/* =====================================================
   KARTU FILE
===================================================== */

function cardHTML(file,i){

    const cat = categories[file.category] || { name:file.category, color:"#7c5cff" };

    const img = file.icon
        ? `<img src="${escapeHTML(file.icon)}"
                alt="Logo ${escapeHTML(file.name)}"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.remove()">`
        : "";

    return `

        <article class="card" style="--c:${cat.color};--i:${i}">

            <div class="logo">
                <span>${escapeHTML(initials(file.name))}</span>
                ${img}
            </div>

            <div class="info">

                <div class="name">${escapeHTML(file.name)}</div>

                <div class="tags">
                    <span class="tag cat">${escapeHTML(cat.name)}</span>
                    <span class="tag type">${escapeHTML(file.type)}</span>
                </div>

            </div>

            <a
                class="dl"
                href="${escapeHTML(file.url)}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Unduh ${escapeHTML(file.name)}"
            >
                ${ICON.download}
                <span>Unduh</span>
            </a>

        </article>

    `;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const q = query.trim().toLowerCase();

    const showReport = current === "report" && !q;

    $("reportView").hidden = !showReport;

    $("listView").hidden = showReport;

    $("homeExtra").hidden = !(current === "home" && !q);

    if(showReport) return;


    let list, title;

    if(q){

        list = files.filter(f =>
            (f.name + " " + f.type + " " +
             (categories[f.category] ? categories[f.category].name : ""))
            .toLowerCase()
            .includes(q)
        );

        title = "Hasil pencarian";

    }else if(current === "home"){

        list = files.slice(-6).reverse();

        title = "Terbaru";

    }else{

        list = files.filter(f => f.category === current);

        title = categories[current].name;

    }


    $("viewTitle").textContent = title;

    $("viewCount").textContent = list.length + " file";


    if(list.length === 0){

        $("fileList").innerHTML = `
            <div class="empty">
                ${q ? "File tidak ditemukan." : "Belum ada file di kategori ini."}
            </div>
        `;

        return;

    }

    $("fileList").innerHTML =
        list.map((file,i) => cardHTML(file,i)).join("");

}


/* =====================================================

===================================================== */

function setActiveTab(key){

    document.querySelectorAll("#tabs button").forEach(btn => {

        btn.classList.toggle("active", btn.dataset.key === key);

    });

}


function go(key){

    current = key;

    query = "";

    $("searchInput").value = "";

    setActiveTab(key);

    render();

    window.scrollTo({ top:0, behavior:"smooth" });

}


function buildTabs(){

    $("tabs").innerHTML = tabs.map(t => `
        <button type="button" data-key="${t.key}">${t.label}</button>
    `).join("");

    $("tabs").addEventListener("click", e => {

        const btn = e.target.closest("button");

        if(btn) go(btn.dataset.key);

    });

    setActiveTab(current);

}


function buildMenu(){

    const items = Object.keys(categories).map(key => ({
        key,
        name:categories[key].name,
        color:categories[key].color,
        info:files.filter(f => f.category === key).length + " file"
    }));

    items.push({
        key:"report",
        name:"Laporan",
        color:"#94a3b8",
        info:"Lapor masalah"
    });

    $("menuGrid").innerHTML = items.map((it,i) => `
        <button class="tile" type="button" data-go="${it.key}" style="--c:${it.color};--i:${i}">
            <span class="ico">${ICON[it.key]}</span>
            <span>
                <b>${escapeHTML(it.name)}</b>
                <small>${escapeHTML(it.info)}</small>
            </span>
        </button>
    `).join("");

}


document.addEventListener("click", e => {

    const el = e.target.closest("[data-go]");

    if(el) go(el.dataset.go);

});


/* cahaya mengikuti jari / kursor pada kartu */
$("fileList").addEventListener("pointermove", e => {

    const card = e.target.closest(".card");

    if(!card) return;

    const r = card.getBoundingClientRect();

    card.style.setProperty("--mx", (e.clientX - r.left) + "px");

    card.style.setProperty("--my", (e.clientY - r.top) + "px");

});

function sendReport(){

    const name = $("reportName").value.trim();

    const message = $("reportMessage").value.trim();

    if(!name || !message){

        alert("Isi nama file dan laporan terlebih dahulu.");

        return;

    }

    /*
       GANTI DENGAN NOMOR WHATSAPP KAMU.
       Contoh:
       628123456789
    */

    const whatsappNumber = "628XXXXXXXXXX";

    const text =
        "LAPORAN EDO WEB\n\n" +
        "File: " + name + "\n\n" +
        "Laporan:\n" + message;

    const url =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(text);

    window.open(url,"_blank");

}

$("reportBtn").addEventListener("click", sendReport);


/* =====================================================
   INTRO
===================================================== */

function countUp(el,duration){

    const to = Number(el.dataset.to) || 0;

    const start = performance.now();

    function tick(now){

        const t = Math.min(1,(now - start) / duration);

        const eased = 1 - Math.pow(1 - t,3);

        el.textContent = Math.round(to * eased);

        if(t < 1) requestAnimationFrame(tick);

    }

    requestAnimationFrame(tick);

}


function startSite(){

    $("website").classList.add("site-in");

    countUp($("statFiles"),1200);

    countUp($("statCats"),900);

}


function finishIntro(){

    const welcome = $("welcome");

    if(welcome) welcome.remove();

    document.body.classList.remove("locked");

}


function enterWebsite(){

    const welcome = $("welcome");

    if(welcome.classList.contains("go")) return;

    const reduceMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if(reduceMotion){

        startSite();

        finishIntro();

        return;

    }

    // titik buka/tutup layar = posisi tombol
    const r = $("enterBtn").getBoundingClientRect();

    welcome.style.setProperty("--x", (r.left + r.width / 2) + "px");

    welcome.style.setProperty("--y", (r.top + r.height / 2) + "px");

    welcome.classList.add("go");

    // 1) blok berputar, teks memudar
    // 2) layar menutup ke arah tombol
    setTimeout(() => welcome.classList.add("wipe"), 600);

    // 3) isi website muncul bertahap
    setTimeout(startSite, 950);

    setTimeout(finishIntro, 1800);

}


/* judul intro: huruf muncul satu per satu */

    const span = document.createElement("span");

    span.className = "ch";

    span.style.setProperty("--i", i);

    span.textContent = ch === " " ? "\u00A0" : ch;

    $("wTitle").appendChild(span);

});

$("enterBtn").addEventListener("click", enterWebsite);
