<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDO Web (Beta)</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 20% 10%, rgba(67,80,255,.18), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(130,50,255,.15), transparent 25%),
        #080b14;
    color:#fff;
    min-height:100vh;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(80,100,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,100,255,.035) 1px, transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom, black, transparent);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    padding:16px 20px;
    background:rgba(9,12,22,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(120,130,255,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#5f8cff,#9c55ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.beta{
    font-size:10px;
    padding:4px 7px;
    border-radius:8px;
    background:rgba(100,100,255,.15);
    color:#9aa9ff;
    margin-left:5px;
    vertical-align:middle;
}

.menu-btn{
    border:0;
    background:rgba(255,255,255,.07);
    color:white;
    font-size:22px;
    width:43px;
    height:43px;
    border-radius:12px;
    cursor:pointer;
}

.menu-btn:active{
    transform:scale(.94);
}

/* SIDE MENU */

.side-menu{
    position:fixed;
    top:0;
    right:-310px;
    width:290px;
    height:100vh;
    z-index:2000;
    background:rgba(10,13,25,.97);
    backdrop-filter:blur(20px);
    border-left:1px solid rgba(100,120,255,.2);
    padding:25px 18px;
    transition:.35s ease;
    box-shadow:-15px 0 50px rgba(0,0,0,.4);
}

.side-menu.active{
    right:0;
}

.side-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:25px;
}

.side-item{
    width:100%;
    border:0;
    padding:14px;
    margin-bottom:9px;
    border-radius:12px;
    color:#ddd;
    background:rgba(255,255,255,.05);
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.side-item:hover{
    background:rgba(91,100,255,.2);
    color:white;
}

.close-menu{
    position:absolute;
    right:18px;
    top:17px;
    border:0;
    background:none;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1500;
    display:none;
}

.overlay.active{
    display:block;
}

/* MAIN */

main{
    max-width:1200px;
    margin:auto;
    padding:25px 18px 60px;
}

/* HERO */

.hero{
    position:relative;
    overflow:hidden;
    border-radius:25px;
    padding:32px 25px;
    margin-bottom:25px;
    background:
        radial-gradient(circle at 80% 30%, rgba(100,80,255,.35), transparent 35%),
        linear-gradient(135deg,#111a38,#121124);
    border:1px solid rgba(110,120,255,.18);
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.hero::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-70px;
    top:-70px;
    border:1px solid rgba(120,130,255,.25);
    border-radius:50%;
    box-shadow:
        0 0 0 25px rgba(100,100,255,.04),
        0 0 0 50px rgba(100,100,255,.03);
}

.hero h1{
    font-size:32px;
    margin-bottom:8px;
}

.hero h1 span{
    color:#7890ff;
}

.hero p{
    color:#9da5bb;
    line-height:1.6;
    max-width:650px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:17px;
    padding:7px 11px;
    border-radius:20px;
    background:rgba(55,220,130,.08);
    border:1px solid rgba(55,220,130,.15);
    color:#6ce6a1;
    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#48e58c;
    box-shadow:0 0 10px #48e58c;
}

/* SEARCH */

.search-box{
    position:relative;
    margin-bottom:22px;
}

.search-box input{
    width:100%;
    padding:16px 18px 16px 48px;
    border:1px solid rgba(120,130,255,.15);
    border-radius:16px;
    outline:none;
    background:rgba(255,255,255,.045);
    color:white;
    font-size:15px;
    transition:.25s;
}

.search-box input:focus{
    border-color:#687cff;
    box-shadow:0 0 25px rgba(90,100,255,.12);
}

.search-box input::placeholder{
    color:#777f94;
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:#7e89aa;
}

/* CATEGORY */

.category-scroll{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:27px;
    scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex-shrink:0;
    border:1px solid rgba(120,130,255,.12);
    background:rgba(255,255,255,.045);
    color:#aeb5c9;
    padding:10px 15px;
    border-radius:13px;
    cursor:pointer;
    transition:.2s;
}

.category-btn.active,
.category-btn:hover{
    background:linear-gradient(135deg,#526cff,#864fff);
    color:white;
    border-color:transparent;
    box-shadow:0 7px 22px rgba(84,82,255,.2);
}

/* SECTION TITLE */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.section-head h2{
    font-size:21px;
}

.file-count{
    color:#747d96;
    font-size:12px;
}

/* FILE GRID */

.file-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    position:relative;
    overflow:hidden;
    border:1px solid rgba(120,130,255,.1);
    background:rgba(255,255,255,.035);
    border-radius:18px;
    padding:15px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:rgba(110,120,255,.35);
    background:rgba(255,255,255,.055);
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.card-top{
    display:flex;
    gap:12px;
    align-items:center;
}

.file-icon{
    width:52px;
    height:52px;
    flex-shrink:0;
    border-radius:14px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#202a56,#17182d);
    border:1px solid rgba(120,130,255,.15);
    font-size:25px;
}

.file-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.file-info{
    min-width:0;
}

.file-name{
    font-size:15px;
    font-weight:bold;
    line-height:1.35;
    word-break:break-word;
}

.file-type{
    display:inline-block;
    margin-top:5px;
    padding:3px 7px;
    border-radius:6px;
    font-size:9px;
    font-weight:bold;
    color:#aeb8ff;
    background:rgba(100,110,255,.1);
}

.card-category{
    margin-top:14px;
    font-size:11px;
    color:#737d95;
}

.download-btn{
    display:block;
    width:100%;
    text-align:center;
    margin-top:13px;
    padding:11px;
    border-radius:11px;
    text-decoration:none;
    color:white;
    font-size:13px;
    font-weight:bold;
    background:linear-gradient(135deg,#4d68ff,#7a45ef);
    transition:.2s;
}

.download-btn:hover{
    filter:brightness(1.12);
    box-shadow:0 8px 20px rgba(90,70,255,.2);
}

.download-btn:active{
    transform:scale(.97);
}

/* EMPTY */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#737b91;
    border:1px dashed rgba(120,130,255,.15);
    border-radius:18px;
}

/* REPORT */

.report{
    padding:25px;
    border-radius:20px;
    background:linear-gradient(135deg,rgba(255,90,90,.08),rgba(255,160,70,.04));
    border:1px solid rgba(255,100,100,.12);
}

.report h2{
    margin-bottom:10px;
}

.report p{
    color:#999fb0;
    line-height:1.6;
}

.report-btn{
    display:inline-block;
    margin-top:17px;
    padding:12px 18px;
    background:#20b95c;
    color:white;
    border-radius:11px;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px 15px 35px;
    color:#60687c;
    font-size:12px;
}

footer strong{
    color:#8c96ff;
}

/* MOBILE */

@media(max-width:850px){
    .file-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:560px){
    header{
        padding:13px 15px;
    }

    .logo{
        font-size:21px;
    }

    main{
        padding:18px 13px 45px;
    }

    .hero{
        padding:25px 19px;
        border-radius:21px;
    }

    .hero h1{
        font-size:27px;
    }

    .file-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:14px;
    }
}
</style>
</head>
